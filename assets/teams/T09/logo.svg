<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="grad_T09" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadow_T09" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer Shield / Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#grad_T09)" stroke="rgba(255,255,255,0.25)" stroke-width="4" filter="url(#shadow_T09)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Futsal Ball Accent -->
  <g transform="translate(100, 48) scale(0.65)" opacity="0.85">
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="0,-7 6,-3 4,4 -4,4 -6,-3" fill="#0f172a"/>
  </g>

  <!-- Team Monogram / Abbr -->
  <text x="100" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    N 1 M
  </text>

  <!-- Category & School Subtext -->
  <rect x="35" y="132" width="130" height="24" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="100" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">
    SMP • ACC 2026
  </text>
</svg>