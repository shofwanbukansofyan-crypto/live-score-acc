<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ACC FUTSAL CUP 2026 - LIVE SCOREBOARD TV</title>
  <meta name="description"
    content="Sistem Live Scoreboard TV Layar Besar Al-Fayyadh Champions Cup 2026. Real-time updates via Supabase.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap"
    rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/css/display.css?v=20261128_v221">

  <!-- Cache-Control & Auto-Purge Cache Stale Worker -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function () {
      try {
        var APP_VER = "20261128_v221";
        if (localStorage.getItem("acc_livescore_version") !== APP_VER) {
          localStorage.setItem("acc_livescore_version", APP_VER);
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (name) { caches.delete(name); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) { reg.unregister(); });
            });
          }
        }
      } catch (e) { }
    })();
  </script>

  <!-- Supabase JS v2 Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- CONTAINER UTAMA LAYAR TV -->
  <main class="tv-scoreboard-container">

    <!-- 1. TOP BAR: LOGO KIRI | LIVE WAKTU TENGAH ATAS | KATEGORI KANAN -->
    <header class="tv-top-bar">
      <div class="tv-top-left">
        <img src="/assets/acc_logo.png" alt="ACC 2026 Logo" class="tv-tournament-logo"
          onerror="this.src='/assets/logo.png'">
      </div>

      <div class="tv-top-center-clock">
        <div class="tv-digital-clock-wrap">
          <div class="tv-digital-clock" id="tvDigitalClock">00:00</div>
        </div>
      </div>

      <div class="tv-top-right">
        <div class="tv-stage-indicator" id="stagePillText">FASE GRUP</div>
      </div>
    </header>

    <!-- 2. MAIN SCOREBOARD ARENA (LOGO KIRI | SKOR BESAR TENGAH | LOGO KANAN) -->
    <section class="tv-main-arena">

      <!-- PANEL TIM HOME (KIRI) -->
      <article class="team-panel home" id="homeCard">
        <div class="team-logo-container">
          <img src="/assets/teams/T16/logo.jpg" alt="Home Team Logo" class="team-logo-img" id="homeTeamLogo"
            onerror="this.src='/assets/acc_logo.png'">
          <span class="team-logo-fallback" id="homeTeamFallback" style="display: none;">HOM</span>
        </div>
        <h2 class="team-name" id="homeTeamName">SMP 5 MANDAI B</h2>

        <div class="team-submeta">
          <!-- FOULS / ADU PENALTI (5 BULATAN) -->
          <div class="futsal-fouls-meter" id="homeMeterBox">
            <span class="fouls-label" id="homeMeterLabel">FOUL</span>
            <div class="fouls-dots-wrap" id="homeFoulsContainer">
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
            </div>
            <span class="pen-meter-score" id="homeMeterPenScore" style="display: none;">0</span>
          </div>
        </div>
      </article>

      <!-- CENTER HUB: GIANT SCORE DI TENGAH PAS -->
      <div class="tv-center-hub">
        <!-- GIANT SCORE -->
        <div class="tv-score-display">
          <div class="score-digit" id="homeScoreDigits">0</div>
          <div class="score-divider">-</div>
          <div class="score-digit" id="awayScoreDigits">0</div>
        </div>

        <!-- PENALTY SHOOTOUT ROW (MUNCUL OTOMATIS JIKA ADU PENALTI) -->
        <div class="penalty-shootout-banner" id="penaltyShootoutRow" style="display: none;">
          <span>🎯 PENALTI:</span>
          <span>(<strong id="homePenScore">0</strong>)</span>
          <span>-</span>
          <span>(<strong id="awayPenScore">0</strong>)</span>
        </div>

        <!-- TIMEOUT COUNTDOWN OVERLAY (MUNCUL SAAT WASIT TIMEOUT) -->
        <div class="timeout-active-overlay" id="timeoutActiveOverlay">
          <h2>⏱️ TIME OUT</h2>
          <div class="timeout-countdown-clock" id="timeoutCountdownClock">00:60</div>
        </div>
      </div>

      <!-- PANEL TIM AWAY (KANAN) -->
      <article class="team-panel away" id="awayCard">
        <div class="team-logo-container">
          <img src="/assets/teams/T04/logo.svg" alt="Away Team Logo" class="team-logo-img" id="awayTeamLogo"
            onerror="this.src='/assets/acc_logo.png'">
          <span class="team-logo-fallback" id="awayTeamFallback" style="display: none;">AWY</span>
        </div>
        <h2 class="team-name" id="awayTeamName">SMPIT IBNUL QAYYIM</h2>

        <div class="team-submeta">
          <!-- FOULS / ADU PENALTI (5 BULATAN) -->
          <div class="futsal-fouls-meter" id="awayMeterBox">
            <span class="fouls-label" id="awayMeterLabel">FOUL</span>
            <div class="fouls-dots-wrap" id="awayFoulsContainer">
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
            </div>
            <span class="pen-meter-score" id="awayMeterPenScore" style="display: none;">0</span>
          </div>
        </div>
      </article>

    </section>

    <!-- 3. MATCH MOMENTUM SECTION (TENGAH, BAWAHNYA SESUAI TIM KANAN KIRI) -->
    <section class="tv-momentum-section">
      <div class="momentum-header">
        <span class="momentum-line"></span>
        <span class="momentum-title">MATCH MOMENTUM</span>
        <span class="momentum-line"></span>
      </div>

      <div class="momentum-columns">
        <!-- MOMENTUM KEJADIAN TIM HOME (KIRI) -->
        <div class="momentum-col home">
          <div class="momentum-events-list" id="momentumHomeEvents"></div>
        </div>

        <!-- PEMISAH VERTIKAL -->
        <div class="momentum-divider"></div>

        <!-- MOMENTUM KEJADIAN TIM AWAY (KANAN) -->
        <div class="momentum-col away">
          <div class="momentum-events-list" id="momentumAwayEvents"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- SELEBRASI GOL POPUP OVERLAY -->
  <div class="goal-celebration-banner" id="goalCelebrationBanner">
    <h1>⚽ GOOOOOOL!</h1>
    <div class="siu-shout">SIUUUU! 🔥</div>
    <p id="goalTeamName">TIM NAMA</p>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script src="/js/config.js?v=20261128_v221"></script>
  <script src="/js/teams.js?v=20261128_v221"></script>
  <script src="/js/supabase-sync.js?v=20261128_v221"></script>
  <script src="/js/app-display.js?v=20261128_v221"></script>

</body>

</html>
