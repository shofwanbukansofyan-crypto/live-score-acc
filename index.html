<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ACC FUTSAL CUP 2026 - LIVE SCOREBOARD TV</title>
  <meta name="description"
    content="Sistem Live Scoreboard TV Layar Besar Al-Fayyadh Champions Cup 2026. Real-time updates via Supabase.">

  <!-- Favicon & PWA App Manifest -->
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#06090e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ACC Score">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap"
    rel="stylesheet">

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/css/display.css">

  <!-- Supabase JS v2 Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- CONTAINER UTAMA LAYAR TV -->
  <main class="tv-scoreboard-container">

    <!-- 1. DETAIL LOGO DI TENGAH ATAS (BERSIH DARI TULISAN PELENGKAP) & FASE GRUP SESUAI -->
    <header class="tv-top-center">
      <img src="/assets/acc_logo.png" alt="ACC 2026 Logo" class="tv-tournament-logo"
        onerror="this.src='/assets/logo.png'">
      <div class="tv-stage-indicator" id="stagePillText">FASE GRUP</div>
    </header>

    <!-- 2. MAIN SCOREBOARD ARENA (MINIMALIS, KURANGI BOX, FOKUS DATA UTAMA) -->
    <section class="tv-main-arena">

      <!-- PANEL TIM HOME (KIRI) -->
      <article class="team-panel home" id="homeCard">
        <div class="team-logo-container">
          <img src="/assets/logo.png" alt="Home Team Logo" class="team-logo-img" id="homeTeamLogo">
          <span class="team-logo-fallback" id="homeTeamFallback" style="display: none;">HOM</span>
        </div>
        <h2 class="team-name" id="homeTeamName">SMP 1 MANDAI</h2>

        <div class="team-submeta">
          <!-- FOULS (FUTSAL 5 LIMIT) -->
          <div class="futsal-fouls-meter">
            <span class="fouls-label">FOUL</span>
            <div class="fouls-dots-wrap" id="homeFoulsContainer">
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
            </div>
          </div>
          <!-- TIMEOUT TAG -->
          <div class="timeout-tag" id="homeTimeoutTag">TO: ADA</div>
        </div>
      </article>

      <!-- CENTER HUB: DIGITAL CLOCK (LIVE MINUTE) & GIANT SCORE -->
      <div class="tv-center-hub">
        <!-- LIVE DIGITAL TIMER (HANYA LIVE MINUTE, TULISAN STATUS DIHAPUS) -->
        <div class="tv-digital-clock-wrap">
          <div class="tv-digital-clock" id="tvDigitalClock">00:00</div>
        </div>

        <!-- GIANT SCORE -->
        <div class="tv-score-display">
          <div class="score-digit" id="homeScoreDigits">0</div>
          <div class="score-divider">:</div>
          <div class="score-digit" id="awayScoreDigits">0</div>
        </div>

        <!-- PENALTY SHOOTOUT ROW (MUNCUL OTOMATIS JIKA ADU PENALTI) -->
        <div class="penalty-shootout-banner" id="penaltyShootoutRow" style="display: none;">
          <span>🎯 PENALTI:</span>
          <span>(<strong id="homePenScore">0</strong>)</span>
          <span>-</span>
          <span>(<strong id="awayPenScore">0</strong>)</span>
        </div>

        <!-- TIMEOUT COUNTDOWN OVERLAY (MUNCUL SAAT WASIT TIMEOUT) -->
        <div class="timeout-active-overlay" id="timeoutActiveOverlay">
          <h2>⏱️ TIME OUT</h2>
          <div class="timeout-countdown-clock" id="timeoutCountdownClock">00:60</div>
        </div>
      </div>

      <!-- PANEL TIM AWAY (KANAN) -->
      <article class="team-panel away" id="awayCard">
        <div class="team-logo-container">
          <img src="/assets/logo.png" alt="Away Team Logo" class="team-logo-img" id="awayTeamLogo">
          <span class="team-logo-fallback" id="awayTeamFallback" style="display: none;">AWY</span>
        </div>
        <h2 class="team-name" id="awayTeamName">SMP 2 MANDAI</h2>

        <div class="team-submeta">
          <!-- FOULS (FUTSAL 5 LIMIT) -->
          <div class="futsal-fouls-meter">
            <span class="fouls-label">FOUL</span>
            <div class="fouls-dots-wrap" id="awayFoulsContainer">
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
              <div class="foul-dot"></div>
            </div>
          </div>
          <!-- TIMEOUT TAG -->
          <div class="timeout-tag" id="awayTimeoutTag">TO: ADA</div>
        </div>
      </article>

    </section>

    <!-- 3. MATCH MOMENTUM SECTION (TENGAH, BAWAHNYA SESUAI TIM KANAN KIRI) -->
    <section class="tv-momentum-section">
      <div class="momentum-header">
        <span class="momentum-line"></span>
        <span class="momentum-title">MATCH MOMENTUM</span>
        <span class="momentum-line"></span>
      </div>

      <div class="momentum-columns">
        <!-- MOMENTUM KEJADIAN TIM HOME (KIRI, MINIMAL 3 BARIS) -->
        <div class="momentum-col home">
          <div class="momentum-events-list" id="momentumHomeEvents">
            <div class="momentum-row empty align-right">
              <div class="event-chip empty-slot"><span class="empty-dash">-</span></div>
            </div>
            <div class="momentum-row empty align-right">
              <div class="event-chip empty-slot"><span class="empty-dash">-</span></div>
            </div>
            <div class="momentum-row empty align-right">
              <div class="event-chip empty-slot"><span class="empty-dash">-</span></div>
            </div>
          </div>
        </div>

        <!-- PEMISAH VERTIKAL -->
        <div class="momentum-divider"></div>

        <!-- MOMENTUM KEJADIAN TIM AWAY (KANAN, MINIMAL 3 BARIS) -->
        <div class="momentum-col away">
          <div class="momentum-events-list" id="momentumAwayEvents">
            <div class="momentum-row empty align-left">
              <div class="event-chip empty-slot"><span class="empty-dash">-</span></div>
            </div>
            <div class="momentum-row empty align-left">
              <div class="event-chip empty-slot"><span class="empty-dash">-</span></div>
            </div>
            <div class="momentum-row empty align-left">
              <div class="event-chip empty-slot"><span class="empty-dash">-</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- SELEBRASI GOL POPUP OVERLAY -->
  <div class="goal-celebration-banner" id="goalCelebrationBanner">
    <h1>⚽ GOOOOOOL!</h1>
    <p id="goalTeamName">TIM NAMA</p>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script src="/js/config.js"></script>
  <script src="/js/supabase-sync.js"></script>
  <script src="/js/app-display.js"></script>

  <!-- PWA SERVICE WORKER REGISTRATION -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('PWA Service Worker reg error:', err);
        });
      });
    }
  </script>

</body>

</html>
